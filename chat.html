<!DOCTYPE html>
<html>
<head>
    <title>ERPNext Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        #chat { height: 500px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .user { text-align: right; margin: 10px 0; }
        .user span { background: #007bff; color: white; padding: 8px 12px; border-radius: 12px; display: inline-block; max-width: 70%; }
        .bot { text-align: left; margin: 10px 0; }
        .bot span { background: #f1f1f1; padding: 8px 12px; border-radius: 12px; display: inline-block; max-width: 70%; white-space: pre-wrap; }
        #input-row { display: flex; gap: 10px; }
        #question { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .loading { color: #999; font-style: italic; }
    </style>
</head>
<body>
    <h2>ERPNext Assistant</h2>
    <div id="chat"></div>
    <div id="input-row">
        <input id="question" type="text" placeholder="Ask anything about your business..." onkeydown="if(event.key==='Enter') ask()">
        <button onclick="ask()">Ask</button>
    </div>
    <script>
        async function ask() {
            const input = document.getElementById('question');
            const chat = document.getElementById('chat');
            const q = input.value.trim();
            if (!q) return;
            input.value = '';

            chat.innerHTML += `<div class="user"><span>${q}</span></div>`;
            chat.innerHTML += `<div class="bot loading" id="loading"><span>Thinking...</span></div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q})
                });
                const data = await res.json();
                document.getElementById('loading').remove();
                chat.innerHTML += `<div class="bot"><span>${data.answer}</span></div>`;
            } catch(e) {
                document.getElementById('loading').remove();
                chat.innerHTML += `<div class="bot"><span>Error: ${e.message}</span></div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
